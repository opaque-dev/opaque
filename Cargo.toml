[workspace]
resolver = "2"
members = [
  "crates/opaque-policy-kernel",
  "crates/opaque-core",
  "crates/opaque-native-approval",
  "crates/opaque-providers",
  "crates/opaque-sandbox",
  "crates/opaque-bounded-work",
  "crates/opaqued",
  "crates/opaque",
  "crates/opaque-approval",
  "crates/opaque-approve-helper",
  "crates/opaque-approver",
  "crates/opaque-tenant",
  "crates/opaque-federation-runtime",
  "crates/opaque-mcp",
  "crates/opaque-web",
  "crates/opaque-showcase",
]

# opaque-showcase is sales/demo collateral (a showcase web app), not core
# product. It is a full workspace member (it cannot be removed: opaqued's
# tests/resource_authority_e2e.rs builds and runs it together with opaqued to
# verify a real security contract — broker identity/token isolation across
# gateway queries), but it is deliberately excluded from the default member
# set so plain `cargo build` / `cargo test` (no arguments) skip compiling it.
# Use `cargo build --workspace` / `cargo test --workspace`, or
# `cargo build -p opaque-showcase`, to include it explicitly.
default-members = [
  "crates/opaque-policy-kernel",
  "crates/opaque-core",
  "crates/opaque-native-approval",
  "crates/opaque-providers",
  "crates/opaque-sandbox",
  "crates/opaque-bounded-work",
  "crates/opaqued",
  "crates/opaque",
  "crates/opaque-approval",
  "crates/opaque-approve-helper",
  "crates/opaque-approver",
  "crates/opaque-tenant",
  "crates/opaque-federation-runtime",
  "crates/opaque-mcp",
  "crates/opaque-web",
]

[workspace.package]
# The single source of truth for the release version: every crate inherits it,
# and scripts/release-prep.sh rewrites this one line.
version = "0.6.0"
license = "BUSL-1.1"
repository = "https://github.com/opaque-dev/opaque"
homepage = "https://github.com/opaque-dev/opaque"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Release binaries are built with `cargo auditable build` (release.yml), which
# links an embedded dependency manifest into a `.dep-v0` section so a shipped
# binary can be audited after the fact with `cargo audit bin`. `strip = true`
# removes symbols at the same link step; on Linux the release workflow strips
# again explicitly with `--keep-section=.dep-v0` to protect that section, and
# a dedicated CI step (scripts/verify_auditable_binary.py) checks every
# shipped binary still carries the manifest after stripping and (on macOS)
# codesigning, rather than assuming the interaction is safe. See
# docs/compliance/verifying-releases.md.
strip = true

[workspace.dependencies]
bytes = "1.10.1"
clap = { version = "4.5.30", features = ["derive"] }
clap_complete = "4.5"
futures-util = { version = "0.3.30", features = ["sink"] }
getrandom = "0.4"
glob-match = "0.2.1"
jsonschema = "0.45"
libc = "0.2.170"
regex = "1.11"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
yaml-rust2 = { version = "0.13.0", default-features = false }
sha2 = "0.10"
thiserror = "2.0.11"
toml_edit = { version = "0.25", features = ["serde"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "signal", "sync", "time", "process"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
crypto_box = { version = "0.9", features = ["seal"] }
zeroize = { version = "1.8", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
indicatif = "0.18"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
wiremock = "0.6"
p256 = { version = "0.13", features = ["ecdsa"] }
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
rcgen = { version = "0.14", features = ["pem"] }
tokio-rustls = "0.26"
rustls = { version = "0.23.45", features = ["ring"] }
mdns-sd = "0.12"
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "service", "server-auto"] }

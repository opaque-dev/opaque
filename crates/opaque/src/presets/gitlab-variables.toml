# Opaque preset: gitlab-variables
#
# Allows agents and humans to set GitLab CI/CD project variables through Opaque.
# Secret values are resolved server-side from refs and never returned to callers.
#
# Usage:
#   opaque policy preset gitlab-variables
#
# Daemon settings such as approval_backend, data_dir or require_seal belong
# ABOVE the first [[rules]] table. TOML has no way back to the top level, so a
# key appended at the end of this file becomes part of the last rule table and
# is ignored. `opaque policy check` warns when that has happened.

# Client classification is audit-only (an agent drives the same signed CLI a human
# does); operations are gated on out-of-band approval, not classification.

[[rules]]
name = "allow-gitlab-set-ci-variable"
operation_pattern = "gitlab.set_ci_variable"
allow = true
client_types = ["agent", "human"]

[rules.approval]
require = "always"
factors = ["local_bio"]
lease_ttl = 300

[[rules]]
name = "allow-test-noop"
operation_pattern = "test.noop"
allow = true
client_types = ["agent", "human"]

[rules.approval]
require = "first_use"
factors = ["local_bio"]
lease_ttl = 300

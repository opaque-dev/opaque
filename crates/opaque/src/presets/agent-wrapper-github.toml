# Opaque preset: agent-wrapper-github
#
# Hardened preset for wrapped LLM workflows:
# - requires session token handshakes for agent-classified clients
# - allows GitHub secret sync operations for agent + human clients
# - keeps deny-by-default for everything else
#
# Usage:
#   opaque init --preset agent-wrapper-github
#
# Daemon settings such as approval_backend, data_dir or require_seal belong
# ABOVE the first [[rules]] table. TOML has no way back to the top level, so a
# key appended at the end of this file becomes part of the last rule table and
# is ignored. `opaque policy check` warns when that has happened.

enforce_agent_sessions = true
agent_session_ttl_secs = 3600

# Client classification is audit-only; enforce_agent_sessions gates agents behind
# an approved session token (created via `opaque connect`, which prompts for
# out-of-band approval).

[[rules]]
name = "allow-github-actions-secret"
operation_pattern = "github.set_actions_secret"
allow = true
client_types = ["agent", "human"]

[rules.approval]
require = "always"
factors = ["local_bio"]
lease_ttl = 300

[[rules]]
name = "allow-github-codespaces-secret"
operation_pattern = "github.set_codespaces_secret"
allow = true
client_types = ["agent", "human"]

[rules.approval]
require = "always"
factors = ["local_bio"]
lease_ttl = 300


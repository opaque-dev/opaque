# Opaque preset: codex-agent
#
# Tailored for OpenAI Codex CLI agent sessions. Enables agent session
# enforcement and allows GitHub secret sync and GitLab CI/CD variable
# operations. All operations require first-use biometric approval with a
# 10-minute lease (one approval per Codex session).
#
# Risk: Low. Secret values are never returned to agents. Agents can set,
# list, or delete secret entries, but plaintext values are resolved inside
# opaqued and sent directly to the provider API.
#
# Workspace scoping is not enabled by default: a shipped preset cannot know
# your repository. To bind a rule to one git remote, add to that rule:
#
#   [rules.workspace]
#   remote_url_pattern = "*github.com:your-org/*"
#
# opaqued verifies the caller's git checkout itself. With that table present,
# requests from outside a matching, verified checkout are denied.
#
# Usage:
#   opaque init --preset codex-agent
#   opaque connect codex

enforce_agent_sessions = true
agent_session_ttl_secs = 3600

# Client classification is audit-only; operations are gated on out-of-band
# approval. enforce_agent_sessions requires an approved session token, created
# via `opaque connect` (which prompts for approval; an agent cannot mint its
# own session because it cannot satisfy the prompt).

# ---- Deny agents from revealing secrets ----

[[rules]]
name = "deny-agent-reveal"
operation_pattern = "*.reveal"
allow = false
client_types = ["agent"]

# ---- GitHub secret rules ----

[[rules]]
name = "allow-github-list-secrets"
operation_pattern = "github.list_secrets"
allow = true
client_types = ["agent"]

[rules.approval]
require = "first_use"
factors = ["local_bio"]
lease_ttl = 600


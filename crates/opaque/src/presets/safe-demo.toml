# Opaque preset: safe-demo
#
# Minimal safe policy for testing Opaque. Only allows the no-op test
# operation (test.noop). All other operations are denied by default.
#
# Risk: None. test.noop does no real work and touches no secrets.
#
# Usage:
#   opaque policy preset safe-demo
#
# Daemon settings such as approval_backend, data_dir or require_seal belong
# ABOVE the first [[rules]] table. TOML has no way back to the top level, so a
# key appended at the end of this file becomes part of the last rule table and
# is ignored. `opaque policy check` warns when that has happened.

[[rules]]
name = "allow-test-noop"
operation_pattern = "test.noop"
allow = true
client_types = ["agent", "human"]

[rules.approval]
require = "first_use"
factors = ["local_bio"]
lease_ttl = 300

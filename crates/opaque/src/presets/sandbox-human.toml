# Opaque preset: sandbox-human
#
# Allows sandboxed command execution, gated on mandatory out-of-band approval on
# every call. A person must approve each execution (Touch ID / polkit); an agent
# cannot satisfy the prompt, so it cannot run commands unattended.
#
# Risk: Medium. sandbox.exec runs arbitrary commands with secret environment
# variables. Output content is never returned to the caller (only exit code and
# byte counts), and approval is required every time.
#
# Usage:
#   opaque policy preset sandbox-human

# ---- Sandbox rules ----

# sandbox.exec is classified SensitiveOutput, so the enclave forces mandatory
# out-of-band approval on every call regardless of client classification (which is
# audit-only). Output content is never returned to the caller — only exit code and
# byte counts — so a secret printed by the command cannot leak back in the response.
[[rules]]
name = "allow-sandbox"
operation_pattern = "sandbox.exec"
allow = true
client_types = ["agent", "human"]

[rules.approval]
require = "always"
factors = ["local_bio"]

# ---- Test operation (for onboarding) ----

[[rules]]
name = "allow-test-noop"
operation_pattern = "test.noop"
allow = true
client_types = ["agent", "human"]

[rules.approval]
require = "first_use"
factors = ["local_bio"]
lease_ttl = 300

[package]
name = "opaqued"
version.workspace = true
edition = "2024"
publish = false
description = "Opaque daemon — policy engine, approval orchestration, and provider execution"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
tempfile = "3"
opaque-core = { path = "../opaque-core" }
opaque-approval = { path = "../opaque-approval" }
opaque-native-approval = { path = "../opaque-native-approval" }
opaque-providers = { path = "../opaque-providers", features = ["gcp", "azure", "doppler", "infisical"] }
opaque-sandbox = { path = "../opaque-sandbox" }
opaque-tenant = { path = "../opaque-tenant" }
opaque-federation-runtime = { path = "../opaque-federation-runtime" }
opaque-bounded-work = { path = "../opaque-bounded-work" }
bytes = { workspace = true }
libc = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
glob-match = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
base64 = { workspace = true }
crypto_box = { workspace = true }
jsonwebtoken = { workspace = true }
zeroize = { workspace = true }
p256 = { workspace = true }
chrono = { workspace = true }
ring = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519"] }
axum = { workspace = true }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
mdns-sd = { workspace = true }
hyper-util = { workspace = true }

[dev-dependencies]
opaque-approver = { path = "../opaque-approver" }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }

# Landlock/seccomp deps moved to opaque-sandbox (crates/opaque-sandbox), the
# only place in the workspace that still uses them directly.

# Linux approval is handled by the opaque-approve-helper binary (subprocess).

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"] }

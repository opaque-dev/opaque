site_name: Opaque
site_description: Gate and audit AI agents at scale with Opaque. Define permitted operations, require human approval, and inspect recorded decisions and outcomes.
site_url: https://opaque.info/
repo_url: https://github.com/opaque-dev/opaque
repo_name: opaque-dev/opaque
docs_dir: docs
exclude_docs: |
  README.md
  overrides/
  product/**
  dogfood.md
  release-dogfood.md
  tenant-boundaries.md

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    logo: material/shield-lock
  # Local licensed fonts come from the shared brand foundation.
  font: false
  favicon: brand/opaque-mark.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.integrate

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

hooks:
  - scripts/mkdocs_brand.py

extra_css:
  - brand/opaque.css
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/opaque-dev/opaque

copyright: 'Copyright &copy; 2026 Patrick Deutsch · Documentation: <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>'


name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/brand/**'
      - 'scripts/mkdocs_brand.py'
      - 'mkdocs.yml'
      - '.python-version'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Never publish the private dogfood checkout through inherited automation.
    if: ${{ github.repository == 'opaque-dev/opaque' && github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@v7
      # Versions are pinned in docs/requirements.txt, and --strict fails the
      # deploy on a dead internal link rather than publishing one.
      - run: uv pip install --system -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

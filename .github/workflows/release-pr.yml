name: Release PR

# Ties the version to the pull requests that merge. Every merge to main
# recomputes the next version from the conventional-commit types since the last
# tag — a `feat:` makes it a minor, a `fix:` a patch — and keeps a single
# "chore(release): vX.Y.Z" pull request open with the bump and the closed-out
# changelog. Merging that PR is the decision to release; nothing is published
# until it is.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General → Workflow permissions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    # Merging the release PR must not immediately open another one.
    if: ${{ github.repository == 'opaque-dev/opaque' && github.event.repository.private == false && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff reads history back to the last tag.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.95.0"

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Prepare the release
        id: prep
        run: ./scripts/release-prep.sh | tee -a "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        if: steps.prep.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: release/next
          base: main
          title: "chore(release): v${{ steps.prep.outputs.version }}"
          commit-message: "chore(release): v${{ steps.prep.outputs.version }}"
          delete-branch: true
          labels: release
          body: |
            Version `v${{ steps.prep.outputs.version }}`, derived from the
            conventional-commit types merged since the last tag — not chosen by
            hand. This branch updates itself as more PRs merge, so it always
            reflects everything that would ship.

            What is in it:

            - the workspace version in `Cargo.toml` (every crate inherits it) and `Cargo.lock`
            - `CHANGELOG.md`: the curated `[Unreleased]` section stamped as `[${{ steps.prep.outputs.version }}]`, with a fresh `[Unreleased]` above it

            **Before merging**, read the changelog section — the entries are
            written by hand and this is the moment to fix anything that reads
            wrong.

            **After merging**, tag it to publish. A tag pushed by CI would not
            start the release workflow (GitHub does not run workflows on events
            raised by `GITHUB_TOKEN`), so this last step is deliberate and
            manual:

            ```sh
            git checkout main && git pull
            git tag v${{ steps.prep.outputs.version }}
            git push origin v${{ steps.prep.outputs.version }}
            ```

            That starts `release.yml`: cross-compiled binaries for four targets,
            codesigned and notarized on macOS, cosign-signed, with release notes
            generated by git-cliff.

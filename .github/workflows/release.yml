name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  qualify:
    if: ${{ github.repository == 'opaque-dev/opaque' && github.event.repository.private == false }}
    name: Qualify tagged source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-features
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -B -m unittest discover -s scripts -p 'test_release_artifacts.py' -v
      - run: python3 -B -m unittest discover -s scripts -p 'test_install_delivery.py' -v

  build:
    needs: qualify
    # Release/signing automation belongs to the public product repository only.
    if: ${{ github.repository == 'opaque-dev/opaque' && github.event.repository.private == false }}
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        # Keep in sync with rust-toolchain.toml (the action's RUSTUP_TOOLCHAIN
        # export outranks the file).
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binaries
        run: |
          for bin in opaqued opaque opaque-mcp opaque-mcp-contract opaque-approve-helper opaque-approver opaque-evidence opaque-web; do
            strip "target/${{ matrix.target }}/release/$bin" 2>/dev/null || true
          done

      - name: Codesign macOS binaries
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || secrets.APPLE_TEAM_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Import certificate to keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Sign each binary
          for bin in opaqued opaque opaque-mcp opaque-mcp-contract opaque-approve-helper opaque-approver opaque-evidence opaque-web; do
            codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
              "target/${{ matrix.target }}/release/$bin"
          done

      - name: Package signed macOS reviewer application
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || secrets.APPLE_TEAM_ID }}
        run: |
          ARCH="arm64"
          if [[ "${{ matrix.target }}" == x86_64-* ]]; then ARCH="x86_64"; fi
          python3 scripts/package-reviewer-macos.py \
            --binary-dir "target/${{ matrix.target }}/release" \
            --output "target/${{ matrix.target }}/release/Opaque Reviewer.app" \
            --architecture "$ARCH" --version "${GITHUB_REF_NAME#v}" \
            --sign-identity "$APPLE_SIGNING_IDENTITY"

      - name: Notarize macOS binaries
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # notarytool only accepts .zip/.pkg/.dmg, not the .tar.gz we ship —
          # Submit the signed application together with standalone binaries.
          # The app receives a stapled ticket; standalone binaries
          # can't be stapled (that only applies to .app/.pkg/.dmg), so
          # Gatekeeper looks the ticket up online by CDHash on first run;
          # the ticket applies regardless of which archive format we later
          # distribute the same signed bytes in.
          NOTARIZE_ZIP="notarize-${{ matrix.target }}.zip"
          ditto -c -k --keepParent "target/${{ matrix.target }}/release/Opaque Reviewer.app" "$NOTARIZE_ZIP"
          zip -j "$NOTARIZE_ZIP" \
            target/${{ matrix.target }}/release/opaqued \
            target/${{ matrix.target }}/release/opaque \
            target/${{ matrix.target }}/release/opaque-mcp \
            target/${{ matrix.target }}/release/opaque-mcp-contract \
            target/${{ matrix.target }}/release/opaque-approve-helper \
            target/${{ matrix.target }}/release/opaque-approver \
            target/${{ matrix.target }}/release/opaque-evidence \
            target/${{ matrix.target }}/release/opaque-web
          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "target/${{ matrix.target }}/release/Opaque Reviewer.app"
          xcrun stapler validate "target/${{ matrix.target }}/release/Opaque Reviewer.app"
          rm -f "$NOTARIZE_ZIP"

      - name: Bind complete payload to tagged source
        run: |
          python3 scripts/release_artifacts.py manifest \
            --binary-dir "target/${{ matrix.target }}/release" \
            --target "${{ matrix.target }}" --version "${GITHUB_REF_NAME#v}" \
            --revision "$GITHUB_SHA"

      - name: Create tarball
        id: tarball
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="opaque-${TAG#v}-${{ matrix.target }}.tar.gz"
          EXTRAS=()
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then EXTRAS+=("Opaque Reviewer.app"); fi
          # BSD tar otherwise adds unmanifested AppleDouble metadata files.
          COPYFILE_DISABLE=1 tar czf "$ARCHIVE" \
            -C "target/${{ matrix.target }}/release" \
            opaqued opaque opaque-mcp opaque-mcp-contract opaque-approve-helper opaque-approver opaque-evidence opaque-web opaque-release.json "${EXTRAS[@]}"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Verify complete archive and smoke native binaries
        run: |
          SMOKE=()
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          if [[ "$HOST" == "${{ matrix.target }}" ]]; then SMOKE+=(--smoke); fi
          python3 scripts/release_artifacts.py verify \
            --archive "${{ steps.tarball.outputs.archive }}" \
            --target "${{ matrix.target }}" --version "${GITHUB_REF_NAME#v}" \
            --revision "$GITHUB_SHA" "${SMOKE[@]}"
          if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
            RELEASE_UNPACKED=$(mktemp -d)
            trap 'rm -rf "$RELEASE_UNPACKED"' EXIT
            tar xzf "${{ steps.tarball.outputs.archive }}" -C "$RELEASE_UNPACKED"
            codesign --verify --deep --strict "$RELEASE_UNPACKED/Opaque Reviewer.app"
            xcrun stapler validate "$RELEASE_UNPACKED/Opaque Reviewer.app"
          fi

      - name: Generate SHA256 checksum
        run: shasum -a 256 "${{ steps.tarball.outputs.archive }}" > "${{ steps.tarball.outputs.archive }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opaque-${{ matrix.target }}
          path: |
            ${{ steps.tarball.outputs.archive }}
            ${{ steps.tarball.outputs.archive }}.sha256

  release:
    if: ${{ github.repository == 'opaque-dev/opaque' && github.event.repository.private == false }}
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Runs before the artifact download below: actions/checkout defaults
      # to `clean: true`, which git-cleans untracked files -- including the
      # downloaded/signed artifacts/ directory if this ran after it.
      - name: Checkout (for changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          args: --latest --strip header

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Rust
        # Keep in sync with rust-toolchain.toml (the action's RUSTUP_TOOLCHAIN
        # export outranks the file). Present only so cargo-cyclonedx can resolve
        # the workspace for the SBOMs below.
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.95.0"

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate SBOMs
        # One CycloneDX SBOM per released binary that is its own workspace crate.
        # --target all captures every release platform's dependency set, not
        # only the runner host. The opaque-mcp-contract and opaque-evidence
        # binaries ship inside other crates and are covered by those crates'
        # SBOMs.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cargo cyclonedx --format json --spec-version 1.5 --target all -q
          for bin in opaqued opaque opaque-mcp opaque-approve-helper opaque-approver opaque-web; do
            cp "crates/$bin/$bin.cdx.json" "artifacts/opaque-${TAG#v}-${bin}.cdx.json"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts
        run: |
          for file in artifacts/*.tar.gz; do
            cosign sign-blob --yes "$file" --output-signature "${file}.sig" --output-certificate "${file}.pem"
          done

      - name: Sign SBOMs
        run: |
          for file in artifacts/*.cdx.json; do
            cosign sign-blob --yes "$file" --output-signature "${file}.sig" --output-certificate "${file}.pem"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.tar.gz.sig
            artifacts/*.tar.gz.pem
            artifacts/*.cdx.json
            artifacts/*.cdx.json.sig
            artifacts/*.cdx.json.pem
